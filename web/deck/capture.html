<!doctype html>
<!-- Renders the landing page's WebGL scene with every bit of page text hidden, so the deck can use it as a clean background. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}iframe{border:0;width:1920px;height:1080px}</style></head>
<body><iframe id="f" src="/"></iframe>
<script>
const f = document.getElementById("f");
f.addEventListener("load", () => {
  const d = f.contentDocument, s = d.createElement("style");
  s.textContent = "body *:not(canvas){visibility:hidden!important} canvas{visibility:visible!important} .grain,.vignette{display:none!important}";
  d.head.appendChild(s);
});
</script></body></html>
